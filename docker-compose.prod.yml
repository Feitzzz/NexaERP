name: nexaerp

x-app: &app
  image: nexaerp-app:${APP_IMAGE_TAG:-latest}
  build:
    context: .
    target: production
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: ${APP_URL:-http://localhost:8080}
    APP_KEY: ${APP_KEY:-}
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-nexaerp}
    DB_USERNAME: ${DB_USERNAME:-nexaerp}
    DB_PASSWORD: ${DB_PASSWORD:-nexaerp}
    CACHE_STORE: database
    SESSION_DRIVER: database
    QUEUE_CONNECTION: database
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app-storage:/app/storage/app
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    <<: *app
    profiles: ["background"]
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    stop_grace_period: 100s
    volumes:
      - app-storage:/app/storage/app

  scheduler:
    <<: *app
    profiles: ["background"]
    command: ["php", "artisan", "schedule:work"]
    stop_grace_period: 30s
    volumes:
      - app-storage:/app/storage/app

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${DB_DATABASE:-nexaerp}
      POSTGRES_USER: ${DB_USERNAME:-nexaerp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexaerp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${DB_USERNAME:-nexaerp}\" -d \"${DB_DATABASE:-nexaerp}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  app-storage:
  postgres-data:
